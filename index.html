<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Combact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #scene { display: block; width: 100vw; height: 100vh; }

    .intro {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: opacity 1.4s ease, backdrop-filter 1.4s ease, -webkit-backdrop-filter 1.4s ease;
    }
    .intro.hide {
      opacity: 0;
      backdrop-filter: blur(0);
      -webkit-backdrop-filter: blur(0);
      pointer-events: none;
    }
    .start {
      font: 500 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: 0.4em;
      text-indent: 0.4em;
      text-transform: uppercase;
      color: #fff;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      padding: 18px 52px;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;
    }
    .start:hover:not(:disabled) {
      background: #fff;
      color: #000;
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.25);
    }
    .dream {
      position: fixed;
      left: 50%;
      bottom: 9vh;
      transform: translate(-50%, 12px);
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: opacity 1s ease, transform 1s ease, background 0.3s, color 0.3s, box-shadow 0.3s;
    }
    .dream.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .scroll-hint {
      position: fixed;
      left: 50%;
      bottom: 6vh;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font: 500 9px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: 0.4em;
      text-indent: 0.4em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    .scroll-hint.show { opacity: 1; }
    .scroll-hint span {
      width: 1px;
      height: 22px;
      background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.8));
      animation: drip 2.2s ease-in-out infinite;
      transform-origin: top;
    }
    @keyframes drip {
      0% { transform: scaleY(0); opacity: 1; }
      60% { transform: scaleY(1); opacity: 1; }
      100% { transform: scaleY(1); opacity: 0; }
    }
    .intro-inner { display: grid; justify-items: center; gap: 28px; padding: 0 16px; text-align: center; }
    .ask {
      margin: 0;
      font: 300 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.75);
    }
    .songs { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .songs .start { padding: 15px 28px; font-size: 11px; }
    .loading {
      margin: 0;
      min-height: 1em;
      font: 400 10px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
    }
    .sound {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 0;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease, border-color 0.3s;
    }
    .sound.show { opacity: 1; pointer-events: auto; }
    .sound:hover { border-color: rgba(255, 255, 255, 0.5); }
    .sound i {
      width: 2px;
      height: 10px;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 1px;
      transform-origin: bottom;
      animation: eq 1s ease-in-out infinite;
    }
    .sound i:nth-child(2) { animation-delay: -0.4s; }
    .sound i:nth-child(3) { animation-delay: -0.7s; }
    .sound.paused i { animation: none; transform: scaleY(0.25); }
    @keyframes eq { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
    .caption {
      position: fixed;
      left: 24px;
      bottom: 6vh;
      max-width: min(360px, calc(100vw - 48px));
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: rgba(255, 255, 255, 0.85);
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .caption.show { opacity: 1; transform: none; }
    .cap-title { font-size: 13px; font-weight: 500; letter-spacing: 0.25em; text-transform: uppercase; }
    .cap-line { margin-top: 8px; font-size: 13px; font-weight: 300; line-height: 1.5; color: rgba(255, 255, 255, 0.55); }
    .title {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #fff;
      pointer-events: none;
      visibility: hidden;
    }
    .title.on { visibility: visible; }
    .title-name {
      white-space: nowrap;
      font-size: min(11.5vw, 34vh);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1;
      text-shadow: 0 0 22px rgba(255, 255, 255, 0.35), 0 0 60px rgba(170, 200, 255, 0.2);
    }
    .title-name span { display: inline-block; will-change: transform, opacity, filter; }
    .intro.playing { background: rgba(0, 0, 0, 0.72); }
    .intro.playing .intro-inner { opacity: 0; pointer-events: none; transition: opacity 0.6s ease; }
    .big-title { position: fixed; inset: 0; overflow: hidden; pointer-events: none; visibility: hidden; }
    .big-title.on { visibility: visible; }
    .big-word {
      position: absolute;
      white-space: nowrap;
      font-family: "Anton", "Arial Narrow", Impact, sans-serif;
      font-weight: 400;
      line-height: 1;
      color: #fff;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.45), 0 0 18px rgba(190, 210, 255, 0.25);
      will-change: transform, opacity;
    }
    .big-word span { display: inline-block; will-change: transform, opacity; }
    .big-sub {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font: 600 clamp(14px, 2.1vw, 28px)/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: 0.55em;
      text-indent: 0.55em;
      white-space: nowrap;
      color: transparent;
      background: linear-gradient(100deg, #8e949c 0%, #d9dde2 30%, #ffffff 45%, #a4abb4 55%, #e6e9ed 75%, #8e949c 100%);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 14px rgba(0, 0, 0, 0.85));
      animation: silver-shine 3.2s linear infinite;
      opacity: 0;
    }
    @keyframes silver-shine { from { background-position: 100% 0; } to { background-position: -150% 0; } }
    .title-sub {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      font-size: clamp(11px, 1.6vw, 18px);
      font-weight: 400;
      letter-spacing: 0.6em;
      text-indent: 0.6em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.75);
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
      opacity: 0;
    }
    .start:disabled { cursor: default; color: rgba(255, 255, 255, 0.5); border-color: rgba(255, 255, 255, 0.15); }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="intro" id="intro">
    <div class="intro-inner">
      <p class="ask">Choose a song to lift your mood</p>
      <div class="songs">
        <button class="start song" data-src="music/Walking On A Dream.mp3" disabled>Walking On A Dream</button>
        <button class="start song" data-src="music/Flashing Lights.mp3" disabled>Flashing Lights</button>
        <button class="start song" data-src="music/oh yeah_.mp3" disabled>Oh Yeah</button>
        <button class="start song" data-src="music/Everybody.mp3" disabled>Everybody</button>
      </div>
      <p class="loading" id="loadingText">Loading</p>
    </div>
  </div>
  <button class="start dream" id="dreamBtn">See my dream</button>
  <div class="scroll-hint" id="scrollHint"><span></span>Scroll</div>
  <div class="caption" id="caption"><div class="cap-title"></div><div class="cap-line"></div></div>
  <button class="sound" id="soundBtn" aria-label="Pause or play the music"><i></i><i></i><i></i></button>
  <script type="module" src="main.js?v=2"></script>
</body>
</html>
